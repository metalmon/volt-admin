name: build-all

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-22.04
            target: linux
          # One universal .dmg covers both Apple Silicon (arm64) and Intel
          # (x86_64) Macs, so a single runner ships every Mac.
          - platform: macos-14
            target: macos
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            build_args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2 + deb/rpm bundlers)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.target == 'macos'
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app (tsc + vite + tauri bundle)
        # matrix.build_args is empty for windows/linux and
        # `--target universal-apple-darwin` for macOS.
        run: bun run tauri build ${{ matrix.build_args }}

      - name: Verify Linux .deb package name + desktop file (Cyrillic display name)
        if: matrix.target == 'linux'
        run: |
          set -e
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          echo "deb: $DEB"
          PKG=$(dpkg-deb -f "$DEB" Package)
          echo "Package: $PKG"
          if [ "$PKG" != "volt-admin" ]; then
            echo "::error::expected Package=volt-admin, got $PKG"
            exit 1
          fi
          dpkg-deb -R "$DEB" /tmp/deb-extract
          DESKTOP=$(find /tmp/deb-extract -name "*.desktop" | head -n1)
          echo "desktop file: $DESKTOP"
          if ! grep -q "Name\[ru\]=Вольт Админ" "$DESKTOP"; then
            echo "::error::missing Name[ru]=Вольт Админ in $DESKTOP"
            exit 1
          fi

      - name: Zip NSIS installer (avoid SmartScreen flag on a bare .exe)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -Recurse | Select-Object -First 1
          if (-not $setup) { throw "no NSIS setup.exe found" }
          Compress-Archive -Path $setup.FullName -DestinationPath "$($setup.FullName).zip"

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.zip

      # Raw .msi as well — enterprise admins want it for silent deploy via
      # GPO/SCCM. (Left unzipped: it is fetched by deployment tooling, not a
      # bare double-click, so the SmartScreen-zip trick doesn't apply.)
      - name: Upload Windows MSI
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Linux packages
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      # NOTE: the .dmg is not code-signed/notarized (no Apple Developer cert),
      # so first launch shows a Gatekeeper warning — same class of prompt as
      # unsigned Windows SmartScreen. Sign+notarize once a cert is available.
      - name: Upload macOS universal .dmg
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # On a `v*` tag, gather every platform's installer into a single DRAFT
  # GitHub Release. Draft (not published) so a human reviews the assets and
  # notes before it goes live — appropriate for an unpublished product.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
