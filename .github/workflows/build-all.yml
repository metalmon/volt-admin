name: build-all

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2 + deb/rpm bundlers)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app (tsc + vite + tauri bundle)
        run: bun run tauri build

      - name: Verify Linux .deb package name + desktop file (Cyrillic display name)
        if: matrix.target == 'linux'
        run: |
          set -e
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          echo "deb: $DEB"
          PKG=$(dpkg-deb -f "$DEB" Package)
          echo "Package: $PKG"
          if [ "$PKG" != "volt-admin" ]; then
            echo "::error::expected Package=volt-admin, got $PKG"
            exit 1
          fi
          dpkg-deb -R "$DEB" /tmp/deb-extract
          DESKTOP=$(find /tmp/deb-extract -name "*.desktop" | head -n1)
          echo "desktop file: $DESKTOP"
          if ! grep -q "Name\[ru\]=Вольт Админ" "$DESKTOP"; then
            echo "::error::missing Name[ru]=Вольт Админ in $DESKTOP"
            exit 1
          fi

      - name: Zip NSIS installer (avoid SmartScreen flag on a bare .exe)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -Recurse | Select-Object -First 1
          if (-not $setup) { throw "no NSIS setup.exe found" }
          Compress-Archive -Path $setup.FullName -DestinationPath "$($setup.FullName).zip"

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.zip

      - name: Upload Linux packages
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: volt-admin-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
